disabled_rules: # rule identifiers to exclude from running
  - conditional_returns_on_newline # lots of warnings 
  - file_length
  - force_cast
  - force_try
  - identifier_name
  - line_length
  - todo
  - trailing_whitespace

opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - computed_accessors_order
  - conditional_returns_on_newline
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - control_statement
  - convenience_type
  - deployment_target
  - discarded_notification_center_observer
  - discouraged_assert
  - discouraged_direct_init
  - discouraged_none_name
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_header
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - let_var_whitespace
  - lower_acl_than_parent
  - modifier_order
  - nimble_operator
  - operator_usage_whitespace
  - optional_enum_case_matching
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - private_subject
  - prohibited_super_call
  - raw_value_for_camel_cased_codable_enum
  - redundant_nil_coalescing
  - redundant_type_annotation
  - required_enum_case
  - return_value_from_void_function
  - self_binding
  - single_test_class
  - sorted_first_last
  - sorted_imports
  - static_operator
  - switch_case_on_newline
  - toggle_bool
  - unavailable_condition
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - weak_delegate
  - yoda_condition
  - shorthand_optional_binding

analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

cyclomatic_complexity:
  warning: 13
  
attributes:
  always_on_same_line: ["@Persisted", "@IBAction", "@Environment"]
  always_on_line_above: ["@MainActor", "@objc"]

# parameterized rules are first parameterized as a warning level, then error level.
type_body_length:
  - 300 # warning
  - 400 # error
  
function_body_length:
  - 60 # warning
  - 100 # error

nesting:
  type_level: 3

file_header:
  required_pattern: |
                    \/\/
                    \/\/  Copyright © \d{4} MUBI. All rights reserved.
                    \/\/

excluded: # paths to ignore during linting. Takes precedence over `included`.
  - fastlane
  - MUBIAssets/Sources/MUBIAssets/R.generated.swift
  - MUBI Go/Supporting Files/R.generated.swift
  - MUBI/Supporting Files/R.generated.swift
  - MUBIKit/Dependencies/
  - MUBIKit/Persistence/RLMSupport.swift
  - MUBITests/
  - MUBITV/Supporting Files/R.generated.swift
  - MUBIUI/Sources/Generated/R.generated.swift
  - Playgrounds
  - Playground.playground
  - '**/MUBIKit/Package.swift'
