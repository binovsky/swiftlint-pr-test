name: SwiftLint PR Check
on:
  pull_request:
    paths:
      - '**/*.swift'

permissions:
  pull-requests: write
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Filter changed Swift files
      id: filter
      uses: dorny/paths-filter@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        list-files: json
        filters: |
          swift:
            - added|modified: '**/*.swift'

    - name: Process file paths for SwiftLint
      id: process_files
      if: steps.filter.outputs.swift == 'true' && steps.filter.outputs.swift_files != ''
      run: |
        # Convert JSON array to space-separated paths with double quotes
        files=$(echo '${{ steps.filter.outputs.swift_files }}' | jq -r '.[] | "\"" + . + "\""' | tr '\n' ' ')
        echo "processed_files=$files" >> $GITHUB_OUTPUT

    - name: Lint changed files
      if: steps.filter.outputs.swift == 'true' && steps.process_files.outputs.processed_files != ''
      uses: cirruslabs/swiftlint-action@v1
      with:
        version: latest
        args: --config ${{ github.workspace }}/.swiftlint.yml --strict --force-exclude ${{ steps.process_files.outputs.processed_files }}
