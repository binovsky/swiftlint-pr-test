name: SwiftLint PR Check
on:
  pull_request:
    paths:
      - '**/*.swift'

permissions:
  pull-requests: write
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Filter changed Swift files
      id: filter
      uses: dorny/paths-filter@v3
      with:
        list-files: shell  # Space-separated paths output
        filters: |
          swift:
            - 'added|modified: ["**/*.swift"]'  # Only added/modified Swift files

    - name: Lint changed files
      if: steps.filter.outputs.swift != 'false' && steps.filter.outputs.swift_files != ''
      uses: cirruslabs/swiftlint-action@v1
      with:
        args: --config .swiftlint.yml --strict ${{ steps.filter.outputs.swift_files }}
