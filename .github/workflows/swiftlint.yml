name: SwiftLint PR Check
on:
  pull_request:
    paths:
      - '**/*.swift'

permissions:
  pull-requests: write
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
          fetch-depth: 0
    
    - name: Filter changed Swift files
      id: filter
      uses: dorny/paths-filter@v3
      with:
        token: ''  # Force git-based detection (fixes API misses)
        list-files: shell
        filters: |
          swift:
            - 'added|modified: ["**/*.swift"]'

    - name: Lint changed files
      if: steps.filter.outputs.swift != 'false'
      uses: cirruslabs/swiftlint-action@v1
      with:
        args: --config .swiftlint.yml --strict ${{ steps.filter.outputs.swift_files }}
