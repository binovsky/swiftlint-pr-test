name: SwiftLint PR Check
on:
  pull_request:
    paths:
      - '**/*.swift'

permissions:
  pull-requests: write
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Filter changed Swift files
      id: filter
      uses: dorny/paths-filter@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        list-files: shell
        filters: |
          swift:
            - added|modified: '**/*.swift'

    - name: Debug output
      run: |
        echo "Swift filter result: ${{ steps.filter.outputs.swift }}"
        echo "Swift files: ${{ steps.filter.outputs.swift_files }}"

    - name: Lint changed files
      if: steps.filter.outputs.swift == 'true' && steps.filter.outputs.swift_files != ''
      run: |
        swiftlint lint \
          --reporter github-actions \
          --config .swiftlint.yml \
          --strict \
          ${{ steps.filter.outputs.swift_files }}
